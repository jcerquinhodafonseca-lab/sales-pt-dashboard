name: Update Sales PT Dashboard

on:
  push:
    paths:
      - "*.csv"
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # always fetch the latest commit, not the triggering one

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate dashboard
        run: python update_dashboard.py

      - name: Rename uploaded CSV to sales_data.csv and remove old ones
        run: |
          # Move any non-standard CSV to sales_data.csv, remove leftovers
          for f in *.csv; do
            [ "$f" = "sales_data.csv" ] && continue
            mv "$f" sales_data.csv
          done

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sales_data.csv
          git add -u   # stage any deletions of old CSVs
          git diff --cached --quiet || git commit -m "Auto-update dashboard $(date +'%Y-%m-%d')"
          git push
